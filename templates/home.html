{% extends 'master.html' %}

{% block title %}
    Home
{% endblock %}

{% block content %}
  <div class="container">
  <h2>Home</h2>

  {% for product in  products %}
      <h2>{{ product.name }}</h2>
      <p>{{ product.price }}</p>
      <p>{{ product.category }}</p>
      <a href="{% url 'delete' product.id %}" class="btn btn-danger"><i class="bi bi-calendar2-x-fill"></i></a>
      <a href="{% url 'edit' product.id %}" class="btn btn-info"><i class="bi bi-pencil-fill"></i></a>
      <a href="{% url 'details' product.id %}" class="btn btn-dark">Details</a>
  {% endfor %}

  </div>
{% endblock %}
