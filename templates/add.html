{% extends 'master.html' %}
{% load django_bootstrap5 %}

{% block title %}
    Create Product
{% endblock %}

{% block content %}
  <div class="container">
  <h2>Add new Product</h2>
      <form action="{% url 'add' %}" method="post" enctype="multipart/form-data">

          {% csrf_token %}
          {% bootstrap_form form %}
{#          {{ form.as_p }}#}
          <button class="btn btn-info">Submit</button>
      </form>
  </div>
{% endblock %}
